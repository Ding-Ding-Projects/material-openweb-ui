name: Gates

# The checks that decide whether work may proceed. They run on every push and
# every pull request, and they fail closed: a red gate is a blocked change, not
# a warning to read later.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '!INVENTORY.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Completeness inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The line counter reports the delta since the fork point, which needs
          # more than the default single commit to resolve.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Upstream declares <=22.x.x with engine-strict, and a transitive
          # dependency wants ^22.13.0. The usable window is narrow on purpose.
          node-version: '22.23.2'

      - name: Inventory matches the tree
        run: node scripts/check-inventory.mjs

      - name: The guard can actually fail
        # A guard nobody has watched fail is a guard nobody should trust. This
        # removes one asserted item at a time and requires red each time.
        run: node scripts/test-inventory-guard.mjs

      - name: RFC 6238 vectors
        # An authenticator that is subtly wrong emits digits every service
        # refuses, with no error anywhere to read. These 18 vectors are the
        # only thing standing between that and shipping.
        run: node scripts/test-totp.mjs

      - name: File detection and conversions
        run: node scripts/test-convert.mjs

      - name: No append() can render a stray "null"
        run: node scripts/test-dom-safety.mjs

      - name: School mode omits rather than disables
        run: node scripts/test-school-mode.mjs

      - name: Locks and the unlock ladder stay safe
        # Five rules are the whole safety of the ladder, and they are very easy
        # to break by accident while making the games nicer.
        run: node scripts/test-locks.mjs

      - name: The QR encoder round-trips through its own decoder
        run: node scripts/test-qr.mjs

      - name: Every custom property read is one that is defined
        run: node scripts/test-tokens.mjs

      - name: The colour translator matches published values
        run: node scripts/test-colour.mjs

      - name: Appearance keys are stable and imports are screened
        run: node scripts/test-appearance.mjs

      - name: The mark is decided by its bytes and never moves the identity
        run: node scripts/test-logo.mjs

      - name: Schedules behave as documented at midnight and both DST boundaries
        run: node scripts/test-schedule.mjs

      - name: Pinned tabs survive bulk closes and groups outlive deletion
        run: node scripts/test-tabs.mjs

      - name: Every export format survives the values that break naive writers
        run: node scripts/test-formats.mjs

      - name: History only grows, and never records a secret
        run: node scripts/test-history.mjs

      - name: No bulk action runs without saying what it cannot show you
        run: node scripts/test-selection.mjs

      - name: Every changelog entry names a commit that resolves
        run: node scripts/test-changelog.mjs

      - name: The unsigned warning comes before any download link
        run: node scripts/test-download.mjs

      - name: Focus is visible and every target is large enough to hit
        run: node scripts/test-a11y.mjs

      - name: The surprise fires at most once and is absent under School mode
        run: node scripts/test-dimsum.mjs

      - name: Every regex builder opens beside its own field
        run: node scripts/test-regex.mjs

      - name: The catalogue counts its pages and names its verdict's basis
        run: node scripts/test-catalogue.mjs

      - name: No inherited workflow can publish upstream's packages from a fork
        run: node scripts/test-workflows.mjs

      # Belongs to this job rather than the next one: it reports the delta since
      # the fork point, which needs the full history checked out above. Moved
      # here after a new job accidentally inherited it along with the steps it
      # was actually meant to take.
      - name: Line count
        run: |
          node scripts/count-lines.mjs --markdown >> "$GITHUB_STEP_SUMMARY"

  # The desktop shell needs a TypeScript compiler, which the job above
  # deliberately does not have: every other gate here runs on a bare checkout
  # with nothing installed, and that is a property worth keeping. So the one
  # gate that needs a build gets its own job and installs only the compiler,
  # rather than the whole frontend dependency tree.
  #
  # This was found by CI rather than by reading: the compile step was added to
  # the dependency-free job, where `tsc` does not exist, and the run went red on
  # a step that had nothing to do with what it was checking.
  shell:
    name: Desktop shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      # Only the three packages the compile actually needs, rather than the
      # whole frontend tree. --ignore-scripts skips Electron's postinstall
      # binary download: this job type-checks the main process, it does not run
      # it, and the several hundred megabytes are pure cost here.
      - name: Install just the compiler and the types it needs
        run: npm install --no-save --ignore-scripts typescript@5.9.3 @types/node@22 electron@33.4.11

      - name: Compile the desktop shell
        run: npx tsc -p electron/tsconfig.json

      - name: Fit verdicts are evidenced and reach the screen
        run: node scripts/test-fit.mjs

  site:
    name: Documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      - name: Every module parses
        # Both surfaces ship untranspiled, so a syntax error reaches a reader as
        # a blank page. The same committed script runs locally, so this can no
        # longer be something only CI notices.
        run: node scripts/test-parse.mjs

      - name: No third-party requests
        # The site claims to load nothing from anyone else. That claim is worth
        # exactly as much as the check behind it.
        run: |
          set -e
          if grep -rnE 'https?://(fonts\.googleapis|fonts\.gstatic|cdn\.|unpkg|jsdelivr|googletagmanager|google-analytics)' docs/ ; then
            echo "::error::A third-party asset host is referenced under docs/. The site must serve everything from its own origin."
            exit 1
          fi
          echo "no third-party asset hosts referenced"

      - name: Every asset referenced by the page exists
        run: |
          set -e
          missing=0
          for ref in $(grep -oE '(href|src)="[^"]+"' docs/index.html | sed -E 's/.*"(.*)"/\1/' | grep -v '^https\?:' | grep -v '^#'); do
            if [ ! -f "docs/$ref" ]; then
              echo "::error file=docs/index.html::references docs/$ref, which does not exist"
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1
          echo "every referenced asset resolves"
